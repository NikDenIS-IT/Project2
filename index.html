<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Конверты</title>
<meta name="description" content="Месячный бюджет по конвертам: деньги сами распределяются по статьям.">
<meta name="theme-color" content="#FAF1F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1215" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Конверты">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: airy single column. A powder-pink summary card, everyday limits as two-column tiles,
   other items as roomy lists, and a floating bottom bar with a round add button in the middle. */
:root{
  --bg:#FAF1F2; --surface:#FFFFFF; --surface-2:#FBEBEE; --ink:#3A2A2F; --muted:#957880; --line:#F3E2E6;
  --accent:#B9506D; --accent-ink:#FFFFFF; --accent-soft:#FBE3EA; --rose:#E493A8;
  --hero:linear-gradient(160deg,#F5CDD6 0%,#EAA8B8 100%); --hero-ink:#4A2530; --hero-muted:rgba(74,37,48,.66); --hero-track:rgba(255,255,255,.55); --hero-chip:rgba(255,255,255,.5);
  --warn:#A2601A; --warn-soft:#FBEBD7; --danger:#B4474F; --danger-soft:#FCE3E3;
  --shadow:0 10px 30px rgba(150,70,95,.10);
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Lora",Georgia,"Times New Roman",serif;
  --r:24px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1215; --surface:#241A1E; --surface-2:#2E2126; --ink:#F5E8EB; --muted:#B39AA2; --line:#3A2A30;
  --accent:#EE9BB1; --accent-ink:#2A1219; --accent-soft:#3E2530; --rose:#D98199;
  --hero:linear-gradient(160deg,#5E3442 0%,#4A2833 100%); --hero-ink:#FBEFF2; --hero-muted:rgba(251,239,242,.7); --hero-track:rgba(255,255,255,.16); --hero-chip:rgba(255,255,255,.1);
  --warn:#E8B56A; --warn-soft:#3A2C1B; --danger:#F0868E; --danger-soft:#43242A;
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1A1215; --surface:#241A1E; --surface-2:#2E2126; --ink:#F5E8EB; --muted:#B39AA2; --line:#3A2A30;
  --accent:#EE9BB1; --accent-ink:#2A1219; --accent-soft:#3E2530; --rose:#D98199;
  --hero:linear-gradient(160deg,#5E3442 0%,#4A2833 100%); --hero-ink:#FBEFF2; --hero-muted:rgba(251,239,242,.7); --hero-track:rgba(255,255,255,.16); --hero-chip:rgba(255,255,255,.1);
  --warn:#E8B56A; --warn-soft:#3A2C1B; --danger:#F0868E; --danger-soft:#43242A;
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
svg{display:block}

.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(130px + env(safe-area-inset-bottom,0px))}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:4px 22px}
.month{display:flex;align-items:center;gap:6px;min-width:0}
.nav{border:0;background:transparent;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.nav:hover:not(:disabled){color:var(--ink)}
.nav:disabled{opacity:.35;cursor:default}
.nav svg{width:18px;height:18px}
.month-t{display:flex;align-items:baseline;gap:6px;padding:0 4px;min-width:0}
.month-t b{font-family:var(--display);font-size:28px;font-weight:600;letter-spacing:-.01em;text-transform:capitalize}
.month-t span{color:var(--muted);font-weight:600}
.avatar{width:42px;height:42px;border-radius:14px;box-shadow:var(--shadow);border:0;background:var(--surface);font-weight:800;color:var(--accent);display:grid;place-items:center;text-transform:uppercase;flex:none}

/* summary */
.sum{background:var(--hero);color:var(--hero-ink);border-radius:28px;padding:24px 22px 20px}
.sum-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sum-label{margin:0;font-size:14px;font-weight:600;color:var(--hero-muted)}
.sum-num{margin:4px 0 0;font-family:var(--display);font-size:clamp(36px,10.5vw,46px);font-weight:600;letter-spacing:-.01em;line-height:1.1}
.sum-sub{margin:4px 0 0;color:var(--hero-muted);font-size:14px}
.bud{border:0;background:var(--hero-chip);color:inherit;border-radius:16px;padding:9px 13px;text-align:right}
.bud span{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:12px;color:var(--hero-muted);font-weight:600}
.bud span svg{width:12px;height:12px}
.bud b{display:block;font-size:16px;font-weight:800}
.bud:hover{background:var(--hero-track)}
.meter{position:relative;height:8px;border-radius:9px;background:var(--hero-track);margin-top:22px}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:9px;background:var(--hero-ink);opacity:.8;transition:width .4s ease}
.meter em{position:absolute;top:-4px;width:3px;height:16px;border-radius:2px;background:var(--hero-ink);opacity:.45;transform:translateX(-1px)}
.meter-cap{margin:10px 0 0;font-size:13px;color:var(--hero-muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.meter-cap b{color:var(--hero-ink)}
.sum-next{display:flex;gap:8px;align-items:flex-start;margin:14px 0 0;font-size:13.5px;color:var(--hero-muted)}
.sum-next svg{width:16px;height:16px;flex:none;margin-top:2px}
.sum-next b{color:var(--hero-ink)}

/* notices */
.notice{display:flex;gap:12px;align-items:center;border-radius:22px;padding:16px;margin-top:14px;background:var(--surface)}
.notice.warn{background:var(--warn-soft)}
.notice-ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.notice.warn .notice-ic{background:var(--surface);color:var(--warn)}
.notice-ic svg{width:18px;height:18px}
.notice p{margin:0;font-size:13.5px;color:var(--muted);flex:1;min-width:0}
.notice p b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:2px}
.notice .btn{padding:10px 14px;font-size:14px;flex:none}

/* groups and rows */
.group{margin-top:32px}
.group-head{display:flex;align-items:center;gap:6px;padding:0 6px 12px}
.group-head h2{margin:0;font-family:var(--display);font-size:21px;font-weight:600}
.tiny{border:0;background:transparent;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.tiny:hover{background:var(--surface);color:var(--ink)}
.tiny svg{width:14px;height:14px}
.group-sum{margin-left:auto;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}
.list{background:var(--surface);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:42px minmax(0,1fr) auto 30px;align-items:center;gap:8px 14px;padding:17px 8px 17px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row-main{min-width:0;border:0;background:transparent;text-align:left;padding:0;display:grid;gap:1px}
button.row-main:hover .row-name{color:var(--accent)}
.row-name{font-weight:700;font-size:15.5px;line-height:1.3;overflow-wrap:anywhere}
.row-sub{font-size:13px;color:var(--muted);line-height:1.4}
.row-sub b{color:var(--ink);font-weight:700}
.val{text-align:right;white-space:nowrap}
.val b{display:block;font-size:16px;font-weight:800}
.val small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.val.bad b{color:var(--danger)} .val.mute b{color:var(--muted)}
.lead{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.lead svg{width:19px;height:19px}
.lead.ok{background:var(--accent-soft);color:var(--accent)}
.lead.warn{background:var(--warn-soft);color:var(--warn)}
.check{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.check svg{width:18px;height:18px}
.check:hover{border-color:var(--accent)}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row.done .row-name{color:var(--muted)}
.row.moved .row-name{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.more{border:0;background:transparent;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.more:hover{background:var(--surface-2);color:var(--ink)}
.more svg{width:18px;height:18px}
.bar{grid-column:2 / -1;height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--rose);transition:width .4s ease}
.bar.warn i{background:var(--warn)} .bar.over i{background:var(--danger)}
.dots{grid-column:2 / -1;display:flex;gap:6px;flex-wrap:wrap}
.dot{width:32px;height:32px;border-radius:50%;border:2px dashed var(--line);background:transparent;font-size:12px;font-weight:800;color:var(--muted);display:grid;place-items:center}
.dot:hover{border-color:var(--accent)}
.dot.on{border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--danger-soft);color:var(--danger)}
.link-btn{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:13.5px;padding:6px 8px;border-radius:8px}
.link-btn:hover{background:var(--accent-soft)}
.add-env{width:100%;margin-top:28px;border:1.5px dashed var(--line);background:transparent;border-radius:var(--r);padding:15px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.add-env:hover{border-color:var(--accent);color:var(--accent)}
.add-env svg{width:16px;height:16px}

/* limit tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{border:0;background:var(--surface);border-radius:var(--r);padding:16px 16px 18px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:146px;min-width:0;color:inherit}
.tile:hover{box-shadow:var(--shadow)}
.tile:last-child:nth-child(odd){grid-column:1 / -1;min-height:0}
.tile-name{font-weight:700;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
.tile-val{font-family:var(--display);font-size:25px;font-weight:600;margin-top:auto;padding-top:10px;white-space:nowrap}
.tile-sub{font-size:12.5px;color:var(--muted);line-height:1.35}
.tile .bar{margin-top:8px;height:5px}
.tile.over{background:var(--danger-soft)} .tile.over .tile-val{color:var(--danger)}
.tile .chip{align-self:flex-start;margin-top:2px}

/* history and stats */
.page-h{font-family:var(--display);font-size:28px;font-weight:600;margin:4px 4px 2px;text-wrap:balance}
.page-sub{margin:0 4px 14px;color:var(--muted);font-size:14px}
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{border:0;background:var(--surface);border-radius:99px;padding:7px 13px;font-size:13.5px;font-weight:700;white-space:nowrap;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.day-h{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--muted);padding:16px 8px 8px}
.exp{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:12px 8px 12px 16px;border-top:1px solid var(--line)}
.exp:first-child{border-top:0}
.exp-env{font-size:12.5px;color:var(--muted);font-weight:600}
.exp-note{font-weight:600;overflow-wrap:anywhere}
.exp-amt{font-weight:800;white-space:nowrap}
.del{border:0;background:transparent;width:30px;height:30px;border-radius:9px;color:var(--muted);display:grid;place-items:center}
.del:hover{background:var(--danger-soft);color:var(--danger)}
.del svg{width:15px;height:15px}
.del.confirm{width:auto;padding:0 10px;background:var(--danger);color:#fff;font-size:12px;font-weight:800}
.card{background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h3{font-size:16px;font-weight:800;margin:0 0 2px}
.card > p{margin:0 0 14px;font-size:13px;color:var(--muted)}
.pf{display:grid;gap:12px}
.pf-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14px}
.pf-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-val{color:var(--muted);font-weight:600;white-space:nowrap}
.pf-val b{color:var(--ink)}
.pf-track{grid-column:1 / -1;position:relative;height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.pf-track i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--accent)}
.pf-track.over i{background:var(--danger)}
.months-chart{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px;overflow-x:auto}
.mc{flex:1 0 46px;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.mc-bars{position:relative;width:100%;max-width:56px;flex:1;display:flex;align-items:flex-end}
.mc-budget{position:absolute;left:0;right:0;border-top:2px dashed var(--muted);opacity:.5}
.mc-stack{width:100%;display:flex;flex-direction:column-reverse;border-radius:8px 8px 4px 4px;overflow:hidden}
.mc-stack .s-saved{background:var(--warn)} .mc-stack .s-spent{background:var(--accent)}
.mc-lbl{font-size:12px;font-weight:700;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* empty, auth */
.empty{text-align:center;padding:44px 20px;background:var(--surface);border-radius:24px}
.empty h2{font-family:var(--display);font-size:22px;font-weight:600;margin:12px 0 6px;text-wrap:balance}
.empty p{color:var(--muted);margin:0 auto 18px;max-width:34ch}
.empty-ic{width:60px;height:60px;margin:0 auto;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.empty-ic svg{width:28px;height:28px}
.empty .btn-row{justify-content:center;max-width:360px;margin:0 auto}
.note{font-size:13px;color:var(--muted);text-align:center;margin:18px 0 0;padding:0 10px}
.banner{display:flex;gap:10px;align-items:center;background:var(--warn-soft);border-radius:14px;padding:10px 14px;font-size:13.5px;margin-bottom:12px}
.banner svg{width:18px;height:18px;color:var(--warn);flex:none}
.skeleton{height:230px;border-radius:24px;background:var(--surface);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.auth{max-width:420px;margin:0 auto;padding-top:min(8vh,56px)}
.auth .sum{padding:26px 22px 44px;margin-bottom:-24px}
.auth-title{font-family:var(--display);font-size:38px;font-weight:600;margin:4px 0 6px;line-height:1.05}
.auth-tag{color:var(--hero-muted);margin:0;max-width:30ch}
.auth-card{position:relative;background:var(--surface);border-radius:22px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:13px;padding:4px;margin-bottom:16px}
.seg button{border:0;background:transparent;border-radius:10px;padding:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.auth-foot{font-size:13px;color:var(--muted);text-align:center;margin:14px 0 0}

/* bottom bar */
.tabbar{position:fixed;z-index:20;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:532px;margin:0 auto;background:var(--surface);border-radius:28px;box-shadow:var(--shadow)}
.tabbar-in{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;height:70px}
.tab{border:0;background:transparent;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.plus{justify-self:center;width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-34px;box-shadow:0 10px 22px rgba(185,80,109,.35);transition:transform .15s}
.plus svg{width:26px;height:26px}
.plus:active{transform:scale(.95)}

/* sheets and forms */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(8,14,12,.45);animation:fade .2s ease}
.sheet{position:relative;width:100%;max-width:540px;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:10px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));animation:up .25s cubic-bezier(.2,.8,.2,1)}
@media (min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:26px;max-height:86%}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-family:var(--display);font-size:24px;font-weight:600;margin:0 0 6px;text-wrap:balance}
.sheet .lead-t{color:var(--muted);margin:0 0 16px;font-size:14px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.form{display:grid;gap:14px}
.field{display:grid;gap:6px}
.field > span,.legend-t,.sec-t{font-size:13px;font-weight:700;color:var(--muted)}
.sec-t{margin:6px 2px -4px}
.input{width:100%;border:1.5px solid var(--line);background:var(--surface-2);border-radius:13px;padding:12px 14px;font-size:16px}
.input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.money{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);padding:6px 2px}
.money:focus-within{border-color:var(--accent)}
.money input{border:0;background:transparent;width:100%;font-family:var(--display);font-weight:600;font-size:42px;padding:0;min-width:0}
.money input:focus{outline:none}
.money span{font-size:26px;font-weight:700;color:var(--muted)}
fieldset{border:0;margin:0;padding:0;min-width:0}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pick label{position:relative}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick .opt{display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:13px;padding:8px 12px;font-weight:700;font-size:14px;cursor:pointer;background:var(--surface)}
.pick .opt small{font-weight:600;color:var(--muted);font-size:12px}
.pick input:checked + .opt{border-color:var(--accent);background:var(--accent-soft)}
.pick input:focus-visible + .opt{outline:2px solid var(--accent);outline-offset:2px}
.pick input:disabled + .opt{opacity:.45;cursor:not-allowed}
.kind-hint{font-size:13px;color:var(--muted);margin:8px 0 0;min-height:1.4em}

/* ---------- types and sections (names can be changed in the app) ---------- */
const KIND_DEF = {save:"Накопления", reserve:"Резерв", pay:"Платёж", visits:"Занятия", limit:"Лимит", buffer:"Буфер", buy:"Разовая трата"};

const TEMPLATE = {income:38000, envelopes:[

]};

/* ---------- state + saving ---------- */
const S = { mode:"loading", user:null, authMode:"in", months:{}, settings:{groups:{}, kinds:{}}, view:null, tab:"month", filter:"all", note:"", lastEnv:null };
let sb = null;
const dirty = new Set(), timers = {};
let chain = Promise.resolve(), setTimer = null, setDirty = false;
const SETTINGS_KEY = "_settings";
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

function save(key, data){
  chain = chain
    .then(() => sb.from("months").upsert({user_id:S.user.id, key, data, updated_at:new Date().toISOString()}, {onConflict:"user_id,key"}))
    .then(res => { if(res && res.error) throw res.error; })
    .catch(() => toast("Не удалось сохранить. Проверьте интернет"));

/* ---------- calculations ---------- */
function ctx(key){
  const [y,m] = key.split("-").map(Number), dim = dimOf(key), cur = keyOf(new Date());
  let day; if(key === cur) day = new Date().getDate(); else if(key < cur) day = dim + 1; else day = 0;
  return {y, m, dim, day, isCurrent:key===cur, isPast:key<cur, daysLeft: key===cur ? dim-day+1 : (key<cur ? 0 : dim)};
}
const incomeOf = m => m.income||0;
const baseOf = e => e.kind==="visits" ? (e.count||0)*(e.price||0) : (e.kind==="buy" && e.moved ? 0 : (e.planned||0));
const unlocked = (e,c) => c.day >= (e.lockDay||1);
const dueSort = (a,b) => (a.due||"9999").localeCompare(b.due||"9999");
/* One month's money is split in this order: payments and classes, everyday limits and reserve,
   one-off purchases (whole items, earliest payment date first), then savings and buffer.
   Money above the plan is shared between limits, savings and buffer in proportion to their plan. */
function allocate(m){
  const inc = incomeOf(m), plan = {}, target = {}, short = {}, extra = {};
  let left = inc, need = 0;
  m.envelopes.forEach(e => { target[e.id] = baseOf(e); plan[e.id] = 0; need += target[e.id]; });
  const of = (kinds, f) => m.envelopes.filter(e => kinds.includes(e.kind) && target[e.id] > 0 && (!f || f(e)));
  const prop = list => {
    const t = list.reduce((a,e) => a + target[e.id], 0); if(t <= 0) return;
    if(left >= t){ list.forEach(e => { plan[e.id] = target[e.id]; }); left -= t; return; }
    const pool = Math.max(0, left), k = pool / t; let used = 0;
    list.forEach((e,i) => { const v = i===list.length-1 ? pool-used : Math.floor(target[e.id]*k/10)*10; plan[e.id] = Math.max(0, Math.min(target[e.id], v)); used += plan[e.id]; });
    left -= used;
  };
  prop([...of(["pay","visits"]), ...of(["buy"], e => e.bought)]);
  prop(of(["limit","reserve"]));
  of(["buy"], e => !e.bought).sort(dueSort).forEach(e => { if(target[e.id] <= left){ plan[e.id] = target[e.id]; left -= target[e.id]; } else short[e.id] = true; });
  prop(of(["save","buffer"]));
  let surplus = 0;
  const flex = of(["limit","save","buffer"]), ft = flex.reduce((a,e) => a + target[e.id], 0);
  if(left > 0 && ft > 0){
    const pool = left; let used = 0;
    flex.forEach((e,i) => { const v = i===flex.length-1 ? pool-used : Math.floor(pool*target[e.id]/ft/10)*10; extra[e.id] = v; plan[e.id] += v; used += v; });
    surplus = pool; left = 0;
  }
  return {inc, plan, target, short, extra, surplus, need, free: Math.max(0, left)};
}
function calc(m){
  const c = ctx(m.key), al = allocate(m), by = {}, mv = {};
  (m.expenses||[]).forEach(x => { by[x.env] = (by[x.env]||0) + (x.amount||0); });
  (m.moves||[]).forEach(t => { mv[t.from] = (mv[t.from]||0) - t.amount; mv[t.to] = (mv[t.to]||0) + t.amount; });
  let buySave = 0;
  m.envelopes.forEach(e => { if(e.kind==="buy" && e.bought && !e.moved) buySave += (e.planned||0) - (e.actual ?? e.planned ?? 0); });
  const rows = m.envelopes.map(e => {
    const plan = (al.plan[e.id]||0) + (mv[e.id]||0); let spent = 0, avail = plan, extra = 0;
    switch(e.kind){
      case "save": case "pay": spent = e.done ? plan : 0; break;
      case "visits": spent = (e.visits||0)*(e.price||0); break;
      case "buy": spent = e.moved ? 0 : (e.bought ? (e.actual ?? e.planned ?? 0) : 0); break;
      case "buffer": spent = by[e.id]||0; extra = buySave; avail = plan + buySave; break;
      default: spent = by[e.id]||0;
    }
    return {e, plan, spent, avail, left: avail - spent, extra, short: !!al.short[e.id] && al.inc > 0, moved: mv[e.id]||0};
  });
  let distributed = 0, saved = 0, spent = 0, canSpend = 0, flexAvail = 0, flexSpent = 0;
  rows.forEach(r => {
    distributed += r.plan;
    if(r.e.kind==="save") saved += r.spent; else spent += r.spent;
    if(r.e.kind==="limit" || r.e.kind==="buffer" || (r.e.kind==="reserve" && unlocked(r.e,c))) canSpend += Math.max(0, r.left);
    if(r.e.kind==="limit" || r.e.kind==="buffer"){ flexAvail += r.avail; flexSpent += r.spent; }
  });
  return {c, rows, al, distributed, saved, spent, canSpend, flexAvail, flexSpent, income: al.inc};
}
/* Where to take money for an overspent envelope:
   buffer, then limits ahead of the month's pace (most spare first), then savings, then other limits. */
const spendKinds = ["limit","buffer","reserve"];
const coverable = (r, id, c) => r.e.id!==id && r.left > 0 && (r.e.kind==="buffer" || r.e.kind==="limit" || r.e.kind==="save" || (r.e.kind==="reserve" && unlocked(r.e,c)));
function suggestCover(k, id){
  const r = k.rows.find(x => x.e.id===id), need0 = Math.max(0, Math.ceil(-r.left)); let need = need0;
  const c = k.c, frac = c.isCurrent ? c.daysLeft/c.dim : c.isPast ? 0 : 1, taken = {};
  const take = (x, max) => { const room = Math.floor(Math.min(max, x.left - (taken[x.e.id]||0))); const v = Math.min(need, room); if(v > 0){ taken[x.e.id] = (taken[x.e.id]||0) + v; need -= v; } };
  const pool = k.rows.filter(x => coverable(x, id, c));
  pool.filter(x => x.e.kind==="buffer").forEach(x => take(x, x.left));
  pool.filter(x => x.e.kind==="limit").map(x => ({x, spare: x.left - x.avail*frac})).filter(o => o.spare > 0).sort((a,b) => b.spare - a.spare).forEach(o => take(o.x, o.spare));
  pool.filter(x => x.e.kind==="save").forEach(x => take(x, x.left));
  pool.filter(x => x.e.kind==="limit" || x.e.kind==="reserve").sort((a,b) => b.left - a.left).forEach(x => take(x, x.left));
  return {need: need0, rest: need, pool, out: pool.filter(x => taken[x.e.id]).map(x => ({id:x.e.id, name:x.e.name, amount:taken[x.e.id]}))};
}

  if(!e.due) return null;
  const d = dayDiff(todayISO(), e.due);

  if(d <= 3) return {cls:"warn", text:`оплатить ${fmtDay(e.due)}`};
  return {cls:"", text:`оплатить ${fmtDay(e.due)}`};
}

function monthView(m,k){
  const c = k.c;
  const perDay = c.isCurrent && c.daysLeft>0 ? k.canSpend/c.daysLeft : 0;
  const monthPct = c.isPast ? 100 : c.isCurrent ? Math.min(100,(c.day-0.5)/c.dim*100) : 0;
  const spentPct = k.flexAvail>0 ? Math.min(100, k.flexSpent/k.flexAvail*100) : 0;
  const sub = c.isCurrent ? `${perDay>0 ? `≈ ${fmt(perDay)} в день · ` : ""}ещё ${c.daysLeft} ${plural(c.daysLeft,"день","дня","дней")}` : c.isPast ? "Месяц завершён" : "Месяц ещё не начался";
  const next = m.envelopes.filter(e => unpaid(e) && e.due).sort(dueSort)[0];
  let h = `<section class="sum" aria-label="Сводка месяца">
    <div class="sum-top">
      <div><p class="sum-label">Можно тратить</p><p class="sum-num num">${fmt(k.canSpend)}</p><p class="sum-sub">${sub}</p></div>
      <button class="bud" data-act="budget"><span>Бюджет ${I.edit}</span><b class="num">${fmt(k.income)}</b></button>
    </div>
    <div class="meter" role="img" aria-label="Лимиты потрачены на ${Math.round(spentPct)}%"><i style="width:${spentPct}%"></i>${c.isCurrent ? `<em style="left:${monthPct}%"></em>` : ""}</div>
    <p class="meter-cap"><span>Потрачено <b class="num">${fmt(k.spent)}</b></span><span>Отложено <b class="num">${fmt(k.saved)}</b></span></p>
    ${next ? `<p class="sum-next">${I.cal}<span>Ближайшая оплата: <b>${esc(next.name)}</b>, ${fmtDay(next.due)} · ${fmt(baseOf(next))}</span></p>` : ""}
  </section>`;
  if(k.income <= 0) h += `<div class="notice"><span class="notice-ic">${I.wallet}</span><p><b>Сколько денег на месяц?</b>Впишите сумму, и она сама разложится по статьям.</p><button class="btn primary" data-act="budget">Внести</button></div>`;
  k.rows.filter(r => r.left < -0.5 && spendKinds.includes(r.e.kind)).forEach(r => {
    const sg = suggestCover(k, r.e.id), from = sg.out.map(o => `«${esc(o.name)}»`).join(", ");
    const text = !sg.out.length ? "В других конвертах свободных денег нет. Можно добавить денег в бюджет."
      : sg.rest > 0 ? `Можно покрыть ${fmt(sg.need - sg.rest)} из ${from}.` : `Можно покрыть из ${from}.`;
    h += `<div class="notice warn"><span class="notice-ic">${I.swap}</span><p><b>Перерасход в «${esc(r.e.name)}»: ${fmt(-r.left)}</b>${text}</p>${sg.out.length ? `<button class="btn primary" data-act="cover" data-id="${esc(r.e.id)}">Покрыть</button>` : `<button class="btn ghost" data-act="budget">Бюджет</button>`}</div>`;
  });
  GROUPS.forEach(g => {
    let rows = k.rows.filter(r => g.kinds.includes(r.e.kind));
    if(!rows.length) return;
    if(g.id==="buys") rows = rows.slice().sort((a,b) => ((a.e.moved?1:0) - (b.e.moved?1:0)) || ((a.e.bought?1:0) - (b.e.bought?1:0)) || dueSort(a.e,b.e));
    const sum = rows.reduce((a,r) => a + r.plan, 0);
    h += `<section class="group"><div class="group-head"><h2>${esc(gName(g))}</h2><button class="tiny" data-act="names" aria-label="Переименовать раздел «${esc(gName(g))}»">${I.edit}</button><span class="group-sum num">${fmt(sum)}</span></div>
      ${g.id==="limits" ? `<div class="tiles">${rows.map(r => tileHTML(r,c)).join("")}</div>` : `<div class="list">${rows.map(r => rowHTML(r,c)).join("")}</div>`}</section>`;
  });
  if(!m.envelopes.length) h += `<p class="note">Пока нет ни одной статьи. Добавьте первую.</p>`;
  h += `<button class="add-env" data-act="add-env">${I.plus} Добавить статью</button>`;
  return h;
}

function barHTML(r, style){
  const pct = r.avail>0 ? Math.min(100, r.spent/r.avail*100) : (r.spent>0 ? 100 : 0);
  return `<div class="bar ${r.left<0 ? "over" : pct>=85 ? "warn" : ""}" ${style ? `style="${style}"` : ""} aria-hidden="true"><i style="width:${pct}%"></i></div>`;
}
function tileHTML(r,c){
  const e = r.e, over = r.left < -0.5;
  let sub = over ? "перерасход" : `осталось из ${fmt(r.avail)}`;
  if(!over && e.kind==="limit" && c.isCurrent && c.daysLeft>0 && r.left>0) sub += `<br>≈ ${fmt(r.left/c.daysLeft)} в день`;
  const chip = r.moved ? `<span class="chip ${r.moved>0?"ok":""}">${r.moved>0?"+":"−"}${fmt(Math.abs(r.moved))} переводом</span>` : (e.kind==="buffer" && r.extra>0 ? `<span class="chip ok">+${fmt(r.extra)} с покупок</span>` : "");
  return `<button class="tile ${over?"over":""}" data-act="open" data-id="${esc(e.id)}" aria-label="${esc(e.name)}: ${over ? "перерасход " + fmt(-r.left) : "осталось " + fmt(r.left)}">
    <span class="tile-name">${esc(e.name)}</span>${chip}
    <span class="tile-val num">${over ? "−"+fmt(-r.left) : fmt(r.left)}</span>
    <span class="tile-sub num">${sub}</span>${barHTML(r)}</button>`;
}
function rowHTML(r,c){
  const e = r.e, id = esc(e.id), name = esc(e.name);
  const more = `<button class="more" data-act="edit" data-id="${id}" aria-label="Изменить: ${name}">${I.dots}</button>`;
  const check = (on, act, label) => `<button class="check ${on?"on":""}" data-act="${act}" data-id="${id}" aria-pressed="${on}" aria-label="${label}">${I.check}</button>`;
  const lead = (svg, tone) => `<span class="lead ${tone||""}">${svg}</span>`;
  const val = (big, small, cls) => `<div class="val ${cls||""}"><b class="num">${big}</b>${small ? `<small>${small}</small>` : ""}</div>`;
  const main = (sub, open) => open ? `<button class="row-main" data-act="open" data-id="${id}"><span class="row-name">${name}</span><span class="row-sub">${sub}</span></button>`
                                   : `<div class="row-main"><span class="row-name">${name}</span><span class="row-sub">${sub}</span></div>`;
  const moved = r.moved ? ` · <span class="chip ${r.moved>0?"ok":""}">${r.moved>0?"+":"−"}${fmt(Math.abs(r.moved))} переводом</span>` : "";
  const due = dueInfo(e), dueChip = due && unpaid(e) ? ` · <span class="chip ${due.cls}">${due.text}</span>` : "";
  if(e.kind==="limit" || e.kind==="buffer" || (e.kind==="reserve" && unlocked(e,c))){
    let sub = `из ${fmt(r.avail)}`;
    if(e.kind==="limit" && c.isCurrent && c.daysLeft>0 && r.left>0) sub += ` · ≈ ${fmt(r.left/c.daysLeft)} в день`;
    if(e.kind==="buffer" && r.extra>0) sub += ` · <span class="chip ok">+${fmt(r.extra)} с покупок</span>`;
    const icon = e.kind==="buffer" ? I.shield : e.kind==="reserve" ? I.unlock : I.wallet;
    return `<div class="row">${lead(icon, r.left<0 ? "warn" : "ok")}${main(sub + moved, true)}
      ${r.left>=0 ? val(fmt(r.left), "осталось") : val("−"+fmt(-r.left), "перерасход", "bad")}${more}${barHTML(r)}</div>`;
  }
  switch(e.kind){
    case "reserve":
      return `<div class="row">${lead(I.lock, "warn")}${main(`Откроется ${e.lockDay||1} ${MONTHS_G[c.m-1]}` + moved)}${val(fmt(r.plan))}${more}</div>`;
    case "save": case "pay": {
      const on = !!e.done;
      const sub = (e.kind==="save" ? (on ? "Отложено" : "Ещё не отложено") : (on ? "Оплачено" : "Ещё не оплачено")) + dueChip + moved;
      return `<div class="row ${on?"done":""}">${check(on, "toggle", `${name}: ${on?"снять отметку":"отметить"}`)}${main(sub)}${val(fmt(r.plan), "", on?"mute":"")}${more}</div>`;
    }
    case "visits": {
      const v = e.visits||0, n = e.count||0; let dots = "";
      for(let i=0;i<n;i++) dots += `<button class="dot ${i<v?"on":""}" data-act="visit" data-id="${id}" data-i="${i}" aria-label="Посещение ${i+1}${i<v?", отмечено":""}">${i+1}</button>`;
      return `<div class="row ${v>=n&&n>0?"done":""}">${lead(I.check, "ok")}${main(`${v} из ${n} · ${fmt(e.price)} за раз`)}${val(fmt(r.plan))}${more}<div class="dots">${dots}</div></div>`;
    }
    case "buy": {
      if(e.moved) return `<div class="row moved">${lead(I.arrow)}${main("Перенесено на следующий месяц")}<button class="link-btn" data-act="unmove" data-id="${id}">Вернуть</button>${more}</div>`;
      const on = !!e.bought; let sub;
      if(on){ const d = (e.planned||0) - (e.actual ?? e.planned ?? 0); sub = d>0 ? `Куплено · <span class="chip ok">+${fmt(d)} в буфер</span>` : "Куплено"; }
      else sub = r.short ? '<span class="chip warn">не помещается в бюджет</span> · можно перенести' : (due ? `<span class="chip ${due.cls}">${due.text}</span>` : "Запланировано");
      return `<div class="row ${on?"done":""}">${check(on, "buy", `${name}: ${on?"снять отметку":"отметить покупку"}`)}${main(sub)}${val(fmt(on ? (e.actual ?? e.planned) : e.planned), "", on?"mute":"")}${more}</div>`;
    }
  }
  return "";
}

function expRow(x, title, sub){
  return `<div class="exp"><div class="exp-main">${sub ? `<div class="exp-env">${esc(sub)}</div>` : ""}<div class="exp-note">${esc(title)}</div></div>
    <div class="exp-amt num">−${fmt(x.amount)}</div>
    <button class="del" data-act="del-exp" data-id="${esc(x.id)}" aria-label="Удалить трату ${fmt(x.amount)}">${I.x}</button></div>`;
}
function historyView(m){
  const envName = id => (m.envelopes.find(e => e.id===id)||{}).name || "Удалённая статья";
  const used = [...new Set(m.expenses.map(x => x.env))];
  if(S.filter!=="all" && !used.includes(S.filter)) S.filter = "all";
  const list = m.expenses.filter(x => S.filter==="all" || x.env===S.filter).slice().sort((a,b) => (b.date||"").localeCompare(a.date||"") || (b.ts||0)-(a.ts||0));
  const total = list.reduce((a,x) => a + x.amount, 0);
  let h = `<h1 class="page-h">Траты</h1><p class="page-sub num">${list.length} ${plural(list.length,"запись","записи","записей")} на ${fmt(total)}</p>`;
  if(used.length) h += `<div class="filters" role="group" aria-label="Фильтр по статьям"><button class="fchip" data-act="filter" data-id="all" aria-pressed="${S.filter==="all"}">Все</button>${used.map(id => `<button class="fchip" data-act="filter" data-id="${esc(id)}" aria-pressed="${S.filter===id}">${esc(envName(id))}</button>`).join("")}</div>`;
  if(!list.length) return h + `<div class="empty"><div class="empty-ic">${I.basket}</div><h2>Трат пока нет</h2><p>Нажмите «+» внизу, чтобы записать первую.</p></div>`;
  const byDay = {};
  list.forEach(x => (byDay[x.date] = byDay[x.date] || []).push(x));
  Object.keys(byDay).sort().reverse().forEach(d => {
    const sum = byDay[d].reduce((a,x) => a + x.amount, 0);
    h += `<div class="day-h"><span>${fmtDay(d)}</span><span class="num">${fmt(sum)}</span></div><div class="list">${byDay[d].map(x => expRow(x, x.note || envName(x.env), x.note ? envName(x.env) : "")).join("")}</div>`;
  });
  return h;
}
function statsView(m,k,keys){
  let h = `<h1 class="page-h">Итоги</h1><p class="page-sub">${esc(monthName(S.view))}: сколько ушло из каждой статьи</p>`;
  const rows = k.rows.filter(r => !(r.e.kind==="buy" && r.e.moved) && (r.avail>0 || r.spent>0));
  h += `<div class="card"><h3>План и факт</h3><p>Полоса показывает, какая часть суммы уже ушла</p><div class="pf">`;
  rows.forEach(r => {
    const pct = r.avail>0 ? Math.min(100, r.spent/r.avail*100) : 100;
    h += `<div class="pf-row"><span class="pf-name">${esc(r.e.name)}</span><span class="pf-val num"><b>${fmt(r.spent)}</b> из ${fmt(r.avail)}</span><div class="pf-track ${r.spent>r.avail+0.5?"over":""}"><i style="width:${pct}%"></i></div></div>`;
  });
  h += `</div></div>`;
  const ms = keys.slice(-6).map(key => { const mm = S.months[key], kk = calc(mm); return {key, income:incomeOf(mm), spent:kk.spent, saved:kk.saved}; });
  const max = Math.max(1, ...ms.map(x => Math.max(x.income, x.spent + x.saved)));
  h += `<div class="card"><h3>По месяцам</h3><p>${ms.length<2 ? "Сравнение появится, когда будет хотя бы два месяца" : "Потрачено и отложено относительно бюджета"}</p><div class="months-chart">`;
  ms.forEach(x => {
    const mo = Number(x.key.split("-")[1]);
    h += `<div class="mc" title="${esc(monthName(x.key))}: потрачено ${fmt(x.spent)}, отложено ${fmt(x.saved)}, бюджет ${fmt(x.income)}">
      <div class="mc-bars"><div class="mc-budget" style="bottom:${x.income/max*100}%"></div>
      <div class="mc-stack" style="height:${(x.spent+x.saved)/max*100}%"><div class="s-saved" style="flex:${x.saved||0}"></div><div class="s-spent" style="flex:${x.spent||0}"></div></div></div>
      <span class="mc-lbl">${MONTHS_S[mo-1]}</span></div>`;
  });
  h += `</div><div class="legend"><span><i style="background:var(--accent)"></i>Потрачено</span><span><i style="background:var(--warn)"></i>Отложено</span><span><i style="border-top:2px dashed var(--muted);height:0;border-radius:0"></i>Бюджет</span></div></div>`;
  return h;
}

/* ---------- sheets ---------- */
function openSheet(html, onMount){
  const w = $("#sheet"), b = $("#sheet-body");
  b.innerHTML = `<div class="grab" aria-hidden="true"></div>` + html;
  w.hidden = false; document.body.style.overflow = "hidden";
  if(onMount) onMount(b);
  const f = b.querySelector("[autofocus]") || b.querySelector("input,button:not(.del)");
  if(f) setTimeout(() => f.focus(), 60);
}
function closeSheet(){ if($("#sheet").hidden) return; $("#sheet").hidden = true; document.body.style.overflow = ""; $("#sheet-body").innerHTML = ""; if(S.mode==="app") render(); }
const errOf = b => t => { const er = b.querySelector(".form-err"); er.textContent = t; er.hidden = false; };

function sheetExpense(pre){
  const m = S.months[S.view], k = calc(m), opts = k.rows.filter(r => spendKinds.includes(r.e.kind));
  if(!opts.length){ openSheet(`<h2>Некуда записать трату</h2><p class="lead-t">Траты записываются в лимиты, буфер или открытый резерв. Добавьте такую статью.</p><button class="btn primary" data-act="add-env">${I.plus} Добавить статью</button>`); return; }
  const okEnv = r => r.e.kind!=="reserve" || unlocked(r.e,k.c);
  const chosen = pre || ((opts.find(r => r.e.id===S.lastEnv && okEnv(r)) || opts.find(r => r.e.kind==="limit") || opts[0]).e.id);
  const defDate = k.c.isCurrent ? todayISO() : `${S.view}-01`;
  openSheet(`<h2>Новая трата</h2><p class="lead-t">${esc(monthName(S.view))}</p>
    <form class="form" id="f-exp" novalidate>
      <label class="money"><input id="exp-amount" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="Сумма" autofocus><span>₽</span></label>
      <fieldset><legend class="legend-t">Из какого конверта</legend><div class="pick">
        ${opts.map(r => { const locked = !okEnv(r);
          return `<label><input type="radio" name="env" value="${esc(r.e.id)}" ${r.e.id===chosen && !locked?"checked":""} ${locked?"disabled":""}><span class="opt">${esc(r.e.name)}<small class="num">${locked ? `откроется ${r.e.lockDay}-го` : r.left<0 ? `перерасход ${fmt(-r.left)}` : `осталось ${fmt(r.left)}`}</small></span></label>`; }).join("")}
      </div></fieldset>
      <label class="field"><span>Комментарий</span><input class="input" id="exp-note" maxlength="80" placeholder="Например, продукты"></label>
      <label class="field"><span>Дата</span><input class="input" type="date" id="exp-date" value="${defDate}"></label>
      <p class="form-err" hidden></p>
      <button class="btn primary" type="submit">Записать</button>
    </form>`, b => {
    b.querySelector("#f-exp").addEventListener("submit", ev => {
      ev.preventDefault();
      const fail = errOf(b), amt = parseMoney(b.querySelector("#exp-amount").value), env = (b.querySelector('input[name="env"]:checked')||{}).value;
      if(!(amt>0)) return fail("Введите сумму больше нуля");
      if(!env) return fail("Выберите конверт");
      S.lastEnv = env; lsSet("konverty.lastEnv", env);
      mutate(mm => mm.expenses.push({id:uid(), env, amount:Math.round(amt*100)/100, note:b.querySelector("#exp-note").value.trim(), date:b.querySelector("#exp-date").value || defDate, ts:Date.now()}));
      closeSheet();
      const r2 = calc(S.months[S.view]).rows.find(x => x.e.id===env);
      toast(r2 && r2.left < -0.5 ? `Записано. В «${r2.e.name}» перерасход ${fmt(-r2.left)}` : `Записано: ${fmt(amt)}`);
    });
  });
}

function sheetCover(id){
  const m = S.months[S.view], k = calc(m), r = k.rows.find(x => x.e.id===id); if(!r) return;
  const sg = suggestCover(k, id), sug = {};
  sg.out.forEach(o => { sug[o.id] = o.amount; });
  const pool = sg.pool.slice().sort((a,b) => (sug[b.e.id]||0) - (sug[a.e.id]||0));
  openSheet(`<h2>Покрыть перерасход</h2>
    <p class="lead-t">В «${esc(r.e.name)}» потрачено на ${fmt(sg.need)} больше, чем было. Приложение предлагает взять деньги из других конвертов: сначала из буфера, потом из лимитов, где остаётся запас. Суммы можно поменять.</p>
    <form class="form" id="f-cover" novalidate>
      ${pool.length ? `<div class="plist">${pool.map(x => `<div class="prow"><span>${esc(x.e.name)}<small class="num">есть ${fmt(x.left)}</small></span>
        <input class="input num cv" data-id="${esc(x.e.id)}" data-max="${Math.floor(x.left)}" inputmode="decimal" value="${sug[x.e.id]||""}" placeholder="0" aria-label="Взять из ${esc(x.e.name)}"></div>`).join("")}</div>`
        : `<p class="hint">В других конвертах нет свободных денег.</p>`}
      <div class="psum" id="cv-sum"></div>
      <p class="form-err" hidden></p>
      <button class="btn primary" type="submit" ${pool.length ? "" : "disabled"}>Перекинуть</button>
    </form>`, b => {
    const read = () => [...b.querySelectorAll(".cv")].map(inp => ({id:inp.dataset.id, max:+inp.dataset.max, v:Math.max(0, parseMoney(inp.value)||0)}));
    const upd = () => { const tot = read().reduce((a,x) => a + x.v, 0); b.querySelector("#cv-sum").innerHTML = `<div class="ps-row ${tot >= sg.need ? "ok" : ""}"><span>Покрыто</span><b class="num">${fmt(tot)} из ${fmt(sg.need)}</b></div>`; };
    b.querySelector("#f-cover").addEventListener("input", upd); upd();
    b.querySelector("#f-cover").addEventListener("submit", ev => {
      ev.preventDefault();
      const fail = errOf(b), xs = read().filter(x => x.v > 0), bad = xs.find(x => x.v > x.max);
      if(bad) return fail(`Из «${(m.envelopes.find(e => e.id===bad.id)||{}).name}» можно взять не больше ${fmt(bad.max)}`);
      if(!xs.length) return fail("Укажите, сколько взять хотя бы из одного конверта");
      const tot = xs.reduce((a,x) => a + x.v, 0);
      mutate(mm => { mm.moves = mm.moves || []; xs.forEach(x => mm.moves.push({id:uid(), from:x.id, to:id, amount:Math.round(x.v), ts:Date.now()})); });
      closeSheet(); toast(`Перекинуто ${fmt(tot)} в «${r.e.name}»`);
    });
  });
}

      ${id ? `<div class="btn-row">${e.kind==="buy" && !e.moved ? `<button type="button" class="btn ghost" data-act="move" data-id="${esc(id)}">${I.arrow} Перенести на следующий месяц</button>` : ""}
        <button type="button" class="btn danger" id="env-del">Удалить статью</button></div>` : ""}
    </form>`, b => {
    const sync = () => {
      const kind = b.querySelector('input[name="kind"]:checked').value;
      b.querySelector("#kind-hint").textContent = KIND_HINT[kind];
      b.querySelector("#w-amount").hidden = kind==="visits";
      b.querySelector("#w-visits").hidden = kind!=="visits";
      b.querySelector("#w-lock").hidden = kind!=="reserve";
      b.querySelector("#w-due").hidden = !(kind==="buy" || kind==="pay");
    };
    b.querySelector("#env-kinds").addEventListener("change", sync); sync();
    const del = b.querySelector("#env-del");
    if(del) del.addEventListener("click", () => {
      if(!del.classList.contains("confirm")){ del.classList.add("confirm"); del.textContent = "Точно удалить? Траты тоже удалятся"; return; }
      mutate(mm => { mm.envelopes = mm.envelopes.filter(x => x.id!==id); mm.expenses = mm.expenses.filter(x => x.env!==id); mm.moves = (mm.moves||[]).filter(x => x.from!==id && x.to!==id); });
      closeSheet(); toast("Статья удалена");
    });

      if(kind==="visits"){
        const cnt = parseInt(b.querySelector("#env-count").value,10), pr = parseMoney(b.querySelector("#env-price").value);
        if(!(cnt>0 && cnt<=31)) return fail("Количество посещений: от 1 до 31");
        if(!(pr>=0)) return fail("Укажите цену за раз");
        Object.assign(upd, {count:cnt, price:pr});
      } else {
        const a = parseMoney(b.querySelector("#env-amount").value);
        if(!(a>=0)) return fail("Укажите сумму");
        upd.planned = a;
      }
      if(kind==="reserve"){ const d = parseInt(b.querySelector("#env-lock").value,10); if(!(d>=1 && d<=31)) return fail("Число месяца: от 1 до 31"); upd.lockDay = d; }

        else mm.envelopes.push(Object.assign({id:uid(), done:false, visits:0, bought:false, actual:null, moved:false}, upd));
      });
      closeSheet(); toast(id ? "Сохранено" : "Статья добавлена");
    });
  });
}

function shiftDue(iso, nk){ if(!iso) return null; const d = Number(iso.slice(8,10)); return nk + "-" + pad(Math.min(d, dimOf(nk))); }
function buildNext(m){
  const nk = nextKey(m.key), envs = [];
  m.envelopes.forEach(e => {
    if(e.kind==="buy" && e.bought && !e.moved) return;
    const n = clone(e); n.id = uid(); n.done = false; n.visits = 0; n.bought = false; n.actual = null; n.moved = false; n.due = shiftDue(e.due, nk);
    envs.push(n);
  });
  return {key:nk, income:incomeOf(m), envelopes:envs, expenses:[], moves:[], createdAt:Date.now()};
}

/* ---------- events ---------- */
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-act],[data-tab]"); if(!t) return;
  if(t.dataset.tab){ S.tab = t.dataset.tab; lsSet("konverty.tab", S.tab); render(); window.scrollTo({top:0}); return; }
  const act = t.dataset.act, id = t.dataset.id, keys = Object.keys(S.months).sort();
  const find = mm => mm.envelopes.find(x => x.id===id);
  switch(act){
    case "close": closeSheet(); break;
    case "prev": { const i = keys.indexOf(S.view); if(i>0){ S.view = keys[i-1]; render(); } break; }
    case "next": { const i = keys.indexOf(S.view); if(i<keys.length-1){ S.view = keys[i+1]; render(); } break; }
    case "new-month": sheetNewMonth(); break;
    case "confirm-new": { const n = buildNext(S.months[S.view]); if(!S.months[n.key]){ S.months[n.key] = n; persist(n.key); } S.view = n.key; closeSheet(); toast(`Создан ${monthName(n.key)}`); break; }
    case "create-first": sheetCreateFirst(); break;
    case "from-template": {
      const cur = keyOf(new Date());
      if(!S.months[cur]){ S.months[cur] = {key:cur, income:TEMPLATE.income, createdAt:Date.now(), expenses:[], moves:[], envelopes: TEMPLATE.envelopes.map(e => Object.assign({id:uid(), done:false, visits:0, bought:false, actual:null, moved:false}, e))}; persist(cur); }
      S.view = cur; render(); toast("Шаблон загружен"); break;
    }
    case "budget": closeSheet(); sheetBudget(); break;
    case "names": closeSheet(); sheetNames(); break;
    case "toggle": mutate(m => { const e = find(m); e.done = !e.done; }); break;
    case "visit": { const i = +t.dataset.i; mutate(m => { const e = find(m); e.visits = (e.visits||0) > i ? i : i+1; }); break; }
    case "buy": { const e = find(S.months[S.view]); if(e.bought) mutate(m => { const x = find(m); x.bought = false; x.actual = null; }); else sheetBuy(id); break; }
    case "move": mutate(m => { const e = find(m); e.moved = true; e.bought = false; e.actual = null; }); closeSheet(); toast("Перенесено на следующий месяц"); break;
    case "unmove": mutate(m => { find(m).moved = false; }); break;
    case "edit": sheetEnvEdit(id); break;
    case "add-env": closeSheet(); sheetEnvEdit(null); break;
    case "open": sheetEnvDetail(id); break;
    case "add-to": closeSheet(); sheetExpense(id); break;
    case "cover": closeSheet(); sheetCover(id); break;
    case "del-move": { const env = t.dataset.env; mutate(m => { m.moves = (m.moves||[]).filter(x => x.id!==id); }); sheetEnvDetail(env); toast("Перевод отменён"); break; }
    case "filter": S.filter = id; render(); break;
    case "del-exp": {
      if(!t.classList.contains("confirm")){ document.querySelectorAll(".del.confirm").forEach(x => { x.classList.remove("confirm"); x.innerHTML = I.x; }); t.classList.add("confirm"); t.textContent = "Удалить"; return; }
      const inSheet = !!t.closest("#sheet-body"), envId = (S.months[S.view].expenses.find(x => x.id===id)||{}).env;
      mutate(m => { m.expenses = m.expenses.filter(x => x.id!==id); });
      if(inSheet && envId) sheetEnvDetail(envId);
      toast("Трата удалена"); break;
    }
    case "auth-mode": S.authMode = id; render(); break;
    case "account": sheetAccount(); break;
    case "logout": closeSheet(); sb.auth.signOut(); break;
  }
});
$("#fab").addEventListener("click", () => sheetExpense());
document.addEventListener("keydown", ev => { if(ev.key==="Escape") closeSheet(); });
let toastT;
function toast(msg){
  const old = document.querySelector(".toast"); if(old) old.remove();
  const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role","status"); el.textContent = msg;
  document.body.appendChild(el); clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 2600);
}

/* ---------- auth + sync ---------- */
function authError(e){
  const m = String((e && e.message) || e || "");
  if(/Invalid login credentials/i.test(m)) return "Неверная почта или пароль";
  if(/already registered|already exists/i.test(m)) return "Аккаунт с этой почтой уже есть. Войдите.";
  if(/at least 6|Password should/i.test(m)) return "Пароль должен быть не короче 6 символов";
  if(/Email not confirmed/i.test(m)) return "Почта не подтверждена. Откройте письмо со ссылкой.";
  if(/rate limit|too many/i.test(m)) return "Слишком много попыток. Подождите минуту.";
  if(/valid email|invalid email|Unable to validate email/i.test(m)) return "Проверьте адрес почты";
  if(/fetch|network/i.test(m)) return "Нет связи с сервером. Проверьте интернет.";
  return "Не получилось: " + m;
}
document.addEventListener("submit", async ev => {
  if(ev.target.id !== "f-auth") return;
  ev.preventDefault();
  const f = ev.target, err = f.querySelector("#au-err"), ok = f.querySelector("#au-ok"), btn = f.querySelector("#au-btn");
  const email = f.querySelector("#au-email").value.trim(), password = f.querySelector("#au-pass").value, up = S.authMode==="up";
  err.hidden = true; ok.hidden = true;
  const fail = t => { err.textContent = t; err.hidden = false; btn.disabled = false; btn.textContent = up ? "Создать аккаунт" : "Войти"; };
  if(!/^\S+@\S+\.\S+$/.test(email)) return fail("Проверьте адрес почты");
  if(password.length < 6) return fail("Пароль должен быть не короче 6 символов");
  btn.disabled = true; btn.textContent = "Подождите…";
  try{
    if(up){
      const {data, error} = await sb.auth.signUp({email, password});
      if(error) return fail(authError(error));
      if(!data.session){ btn.disabled = false; btn.textContent = "Создать аккаунт"; ok.textContent = "Аккаунт создан. Подтвердите почту по ссылке из письма, потом войдите."; ok.hidden = false; return; }
      await enter(data.session.user);
    } else {
      const {data, error} = await sb.auth.signInWithPassword({email, password});
      if(error) return fail(authError(error));
      await enter(data.user);
    }
  }catch(e){ fail(authError(e)); }
});
function normalize(m, key){ m = m || {}; m.key = m.key || key; m.envelopes = m.envelopes || []; m.expenses = m.expenses || []; m.moves = m.moves || []; return m; }
async function loadMonths(){
  const {data, error} = await sb.from("months").select("key,data");
  if(error) throw error;
  const next = {};
  (data||[]).forEach(r => {
    if(r.key === SETTINGS_KEY){ if(!setDirty) S.settings = Object.assign({groups:{}, kinds:{}}, r.data||{}); return; }
    if(!/^\d{4}-\d{2}$/.test(r.key)) return;
    next[r.key] = dirty.has(r.key) && S.months[r.key] ? S.months[r.key] : normalize(clone(r.data), r.key);
  });
  Object.keys(S.months).forEach(k => { if(dirty.has(k) && !next[k]) next[k] = S.months[k]; });
  S.months = next;
}
async function enter(user){
  S.user = user; S.mode = "loading"; render();
  try{ await loadMonths(); S.note = ""; }
  catch(e){ S.note = "Не удалось загрузить данные. Проверьте интернет и обновите страницу."; }
  S.mode = "app"; render();
}
document.addEventListener("visibilitychange", async () => {
  if(document.visibilityState !== "visible" || S.mode !== "app" || dirty.size || setDirty || !$("#sheet").hidden) return;
  try{ await loadMonths(); render(); }catch(e){}
});
async function boot(){
  S.tab = lsGet("konverty.tab") || "month"; S.lastEnv = lsGet("konverty.lastEnv");
  if(!/^https:\/\//.test(SUPABASE_URL) || !window.supabase){ S.mode = "config"; render(); return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}});
  render();
  sb.auth.onAuthStateChange(event => { if(event === "SIGNED_OUT"){ S.user = null; S.months = {}; S.settings = {groups:{}, kinds:{}}; S.view = null; S.note = ""; S.mode = "auth"; render(); } });
  try{
    const {data} = await sb.auth.getSession();
    if(data && data.session) await enter(data.session.user); else { S.mode = "auth"; render(); }
  }catch(e){ S.mode = "auth"; render(); }
}
boot();
})();
</script>
